services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hshops:1.0
    container_name: hshops-api
    ports:
      - "8000:8000"
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
