name: HShops CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "POSTGRES_DB=hshops" >> .env
          echo "POSTGRES_USER=hshops" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Check API health
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check database integration
        run: curl --fail http://127.0.0.1/users

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs
        if: failure()
        run: docker compose logs
