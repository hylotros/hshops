name: HShops CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "POSTGRES_DB=hshops" >> .env
          echo "POSTGRES_USER=hshops" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Check API health
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check database integration
        run: curl --fail http://127.0.0.1/users

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs
        if: failure()
        run: docker compose logs
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/hshops_deploy
          chmod 600 ~/.ssh/hshops_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/hshops_deploy "$SSH_USER@$SSH_HOST" '
            cd ~/projects/hshops &&
            git pull --ff-only &&
            docker compose up -d --build
          '
